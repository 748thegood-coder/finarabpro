  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اتصل بنا - FinArab Pro</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body { font-family: 'Cairo', sans-serif; background: #f8f9fa; padding: 40px 20px; }
    .container { max-width: 700px; margin: auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h1 { color: #0a2540; border-bottom: 3px solid #00c896; padding-bottom: 15px; }
    input, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; font-family: 'Cairo'; }
    button { background: #00c896; color: white; border: none; padding: 14px 30px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 16px; }
    button:hover { background: #00a87e; }
  </style>
</head>
<body>
  <div class="container">
    <h1><i class="fa-solid fa-envelope"></i> اتصل بنا</h1>
    <p>عندك سؤال او اقتراح لمقال جديد؟ راسلنا وحنرد عليك في خلال 24 ساعة.</p>
    
    <form action="mailto:info@finarabpro.com" method="post" enctype="text/plain">
      <label>الاسم</label>
      <input type="text" name="الاسم" placeholder="اكتب اسمك" required>
      
      <label>الايميل</label>
      <input type="email" name="الايميل" placeholder="example@gmail.com" required>
      
      <label>الرسالة</label>
      <textarea name="الرسالة" rows="6" placeholder="اكتب رسالتك هنا..." required></textarea>
      
      <button type="submit"><i class="fa-solid fa-paper-plane"></i> ارسال الرسالة</button>
    </form>
    <p style="margin-top:20px; font-size:14px; color:#666;">الايميل: info@finarabpro.com</p>
  </div>
</body>
</html>
